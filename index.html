<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luka Pirroni — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0e12;
      --surface: #13161c;
      --border: #1e222b;
      --accent: #1E6FA5;
      --accent-bright: #3a9fd6;
      --text: #e8eaf0;
      --muted: #7a8090;
      --rule: #1e222b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .accent-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-bright) 100%);
    }

    .card-body {
      padding: 48px 48px 40px;
    }

    /* Prominent CV Badge Button */
    .cv-link {
      position: absolute;
      top: 16px;
      right: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    
    .cv-link:hover {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30, 111, 165, 0.3);
    }
    
    .cv-link svg { flex-shrink: 0; }

    .eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--accent-bright);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .title {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 36px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 36px;
    }

    .cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border-radius: 3px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-bright); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

    .btn svg { flex-shrink: 0; }

    .card-footer {
      padding: 16px 48px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-size: 12px;
      color: var(--muted);
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-links a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--accent-bright); }

    @media (max-width: 480px) {
      .card-body { padding: 32px 24px 28px; }
      h1 { font-size: 40px; }
      .card-footer { flex-direction: column; gap: 12px; align-items: flex-start; padding: 16px 24px; }
      .cv-link { top: 14px; right: 14px; padding: 5px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent-bar"></div>

    <a class="cv-link" href="LukaPirroniCV.pdf" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>
      </svg>
      <span>View CV</span>
    </a>

    <div class="card-body">
      <p class="eyebrow">Engineering Portfolio</p>
      <h1>LUKA<br>PIRRONI</h1>
      <p class="title">Mechanical Engineering (Automotive) Graduate &nbsp;·&nbsp; London, UK</p>

      <div class="divider"></div>

      <div class="cta-row">
        <a class="btn btn-primary" href="LukaPirroniPortfolio.pdf" target="_blank">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          View Portfolio
        </a>
        <a class="btn btn-ghost" href="LukaPirroniPortfolio.pdf" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download PDF
        </a>
      </div>
    </div>

    <div class="card-footer">
      <span class="footer-text">lukapirroni28@gmail.com</span>
      <div class="footer-links">
        <a href="https://linkedin.com/in/lukapirroni" target="_blank">LinkedIn</a>
      </div>
    </div>
  </div>
</body>
</html>
